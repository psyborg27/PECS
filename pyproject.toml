[build-system]
requires = ["setuptools>=65.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pecs_pro"
version = "1.0.0-alpha1"
description = "PECS-PRO workspace continuity cache and daemon"
authors = [
  {name = "PECS-PRO"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "watchdog>=3.0.0,<4.0.0",
]

[project.urls]
Home = "https://example.com/pecs_pro"

[project.scripts]
pecs = "workspace_bridge_cli:main"
pecs-pro = "workspace_bridge_cli:main"
pecs-pro-daemon = "run_pecs_daemon:main"
pecs-pro-install-workspace = "install_workspace_integration:main"

[tool.setuptools]
packages = {find = {where = ["."], include = ["pecs_pro", "continuity*", "evidence_correlation*", "execution_graph*", "exports*", "integrations*", "navigation_builder*", "runtime*", "topology*", "validation*", "workspace_assets*", "workspace_registry*"]}}
py-modules = [
  "append_ai_chat_history",
  "install_workspace_integration",
  "run_pecs_daemon",
  "run_pecs_lite_v2_daemon",
  "run_pecs_pro",
  "workspace_assets_manager",
  "workspace_bridge_cli",
]
include-package-data = true
